<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="'Microsoft JhengHei','Noto Sans TC','PingFang TC',sans-serif">
  <defs>
    <filter id="soft" x="-4%" y="-4%" width="108%" height="112%">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#1e1e2e" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- background -->
  <rect width="1280" height="720" fill="#f7f6f3"/>
  <rect x="0" y="0" width="13" height="720" fill="#3d5a80"/>

  <!-- title -->
  <text x="72" y="74" font-size="30" font-weight="bold" fill="#1e1e2e">從記事本到 IDE：VS Code 站在哪裡？</text>
  <text x="72" y="106" font-size="16" fill="#6b7280">越往上，功能越多、體積越重；越往下，越輕、越通用</text>

  <!-- ===== Tier 3: IDE ===== -->
  <g filter="url(#soft)">
    <rect x="150" y="150" width="720" height="120" rx="10" fill="#e3efe8" stroke="#2d6a4f" stroke-width="1.5"/>
  </g>
  <rect x="150" y="150" width="6" height="120" rx="3" fill="#2d6a4f"/>
  <text x="180" y="192" font-size="22" font-weight="bold" fill="#1e1e2e">IDE　整合開發環境</text>
  <text x="180" y="220" font-size="15" fill="#6b7280">Visual Studio · IntelliJ · Xcode</text>
  <text x="180" y="248" font-size="15" fill="#1e1e2e">編輯 ＋ 編譯／執行 ＋ 除錯器 ＋ 建置 ＋ 測試　全整合在一個視窗</text>
  <text x="180" y="270" font-size="13" fill="#c8863a">開箱即用，但通常肥大、綁特定語言、啟動慢</text>

  <!-- ===== Tier 2: Code editor ===== -->
  <g filter="url(#soft)">
    <rect x="150" y="300" width="560" height="120" rx="10" fill="#e8eef4" stroke="#3d5a80" stroke-width="1.5"/>
  </g>
  <rect x="150" y="300" width="6" height="120" rx="3" fill="#3d5a80"/>
  <text x="180" y="342" font-size="22" font-weight="bold" fill="#1e1e2e">程式碼編輯器</text>
  <text x="180" y="370" font-size="15" fill="#3d5a80" font-weight="bold">VS Code 本體</text>
  <text x="180" y="398" font-size="15" fill="#1e1e2e">語法高亮 · 自動完成 · 括號配對 · 檔案總管 · 搜尋 · Git</text>
  <text x="180" y="420" font-size="13" fill="#6b7280">看得懂程式語言，管理整個專案而不只單一檔案</text>

  <!-- ===== Tier 1: Plain text ===== -->
  <g filter="url(#soft)">
    <rect x="150" y="450" width="400" height="110" rx="10" fill="#ffffff" stroke="#e0ddd6" stroke-width="1.5"/>
  </g>
  <rect x="150" y="450" width="6" height="110" rx="3" fill="#6b7280"/>
  <text x="180" y="492" font-size="22" font-weight="bold" fill="#1e1e2e">純文字編輯器</text>
  <text x="180" y="520" font-size="15" fill="#6b7280">記事本 · TextEdit</text>
  <text x="180" y="548" font-size="15" fill="#1e1e2e">只能打字、存檔——不懂你在寫什麼</text>

  <!-- ===== Right: growth arrow ===== -->
  <line x1="960" y1="540" x2="960" y2="210" stroke="#c8863a" stroke-width="2.5" marker-end="url(#arrow)"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c8863a"/>
    </marker>
  </defs>
  <text x="985" y="380" font-size="16" font-weight="bold" fill="#c8863a" transform="rotate(0 985 380)">VS Code</text>
  <text x="985" y="404" font-size="14" fill="#c8863a">＋ 擴充套件</text>
  <text x="985" y="428" font-size="14" fill="#c8863a">往上長</text>

  <!-- dashed connector: VS Code editor -> IDE capabilities -->
  <line x1="710" y1="330" x2="900" y2="260" stroke="#3d5a80" stroke-width="1.5" stroke-dasharray="5 4"/>

  <!-- bottom note -->
  <text x="150" y="612" font-size="15" fill="#1e1e2e">
    <tspan font-weight="bold" fill="#3d5a80">重點：</tspan>VS Code 一開始是編輯器，你給它裝什麼，它就變成什麼。
  </text>
  <text x="150" y="638" font-size="14" fill="#6b7280">今天下午我們會裝 Python 擴充套件，裝完它就多了執行、除錯、自動完成 Python 的能力。</text>
</svg>
