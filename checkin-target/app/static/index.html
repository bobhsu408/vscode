<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>課程簽到系統</title>
<style>
  :root{
    --ink:#1e1e2e; --paper:#f7f6f3; --steel:#3d5a80;
    --steel-soft:#e8eef4; --green:#2d6a4f; --green-soft:#e3efe8;
    --grey:#6b7280; --line:#e0ddd6; --amber:#c8863a; --amber-soft:#f6e9d8;
  }
  *{box-sizing:border-box;}
  body{
    font-family:"Noto Sans TC","IBM Plex Sans",sans-serif;
    background:var(--paper); color:var(--ink);
    margin:0; padding:32px 20px 60px;
  }
  .wrap{max-width:760px;margin:0 auto;}
  h1{font-size:24px;margin:0 0 6px;}
  .sub{color:var(--grey);font-size:14px;margin:0 0 24px;}
  table{width:100%;border-collapse:collapse;background:#fff;border-radius:10px;overflow:hidden;box-shadow:0 1px 0 var(--line);}
  th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line);font-size:14px;}
  th{background:var(--steel-soft);color:var(--steel);font-size:12px;letter-spacing:.03em;text-transform:uppercase;}
  .badge{display:inline-block;padding:3px 10px;border-radius:999px;font-size:12.5px;font-weight:600;}
  .badge.in{background:var(--green-soft);color:var(--green);}
  .badge.out{background:var(--steel-soft);color:var(--grey);}
  footer{margin-top:24px;font-size:12.5px;color:var(--grey);}
</style>
</head>
<body>
<div class="wrap">
  <h1>課程簽到系統</h1>
  <p class="sub">即時簽到狀態一覽</p>
  <table id="tbl">
    <thead>
      <tr><th>學員</th><th>User ID</th><th>狀態</th><th>最後更新</th></tr>
    </thead>
    <tbody></tbody>
  </table>
  <footer>資料每 3 秒自動更新。</footer>
</div>

<script>
async function refresh() {
  const res = await fetch('/api/records');
  const data = await res.json();
  const tbody = document.querySelector('#tbl tbody');
  tbody.innerHTML = data.map(r => {
    const last = r.history.length ? r.history[r.history.length - 1].time : '—';
    const cls = r.status === 'in' ? 'in' : 'out';
    const label = r.status === 'in' ? '已簽到' : '未簽到';
    return `<tr>
      <td>${r.name}</td>
      <td>${r.user_id}</td>
      <td><span class="badge ${cls}">${label}</span></td>
      <td>${last}</td>
    </tr>`;
  }).join('');
}
refresh();
setInterval(refresh, 3000);
</script>
</body>
</html>
